name: SonarCloud
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compila sorgenti
        run: |
          mkdir -p out/production out/test
          CLASSPATH=$(find lib -name "*.jar" | tr '\n' ':')
          javac -cp "$CLASSPATH" \
            -d out/production \
            $(find src -name "*.java")

      - name: Compila test
        run: |
          CLASSPATH=$(find lib -name "*.jar" | tr '\n' ':')
          javac -cp "$CLASSPATH:out/production" \
            -d out/test \
            $(find test -name "*.java")

      - name: Esegui test con JaCoCo
        run: |
          CLASSPATH=$(find lib -name "*.jar" | tr '\n' ':')
          java -javaagent:lib/jacocoagent.jar=destfile=jacoco.exec \
            -cp "$CLASSPATH:out/production:out/test" \
            org.junit.platform.console.standalone.ConsoleLauncher \
            --scan-class-path out/test

      - name: Genera report JaCoCo XML
        run: |
          java -jar lib/jacococli.jar report jacoco.exec \
            --classfiles out/production \
            --sourcefiles src \
            --xml jacoco.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}